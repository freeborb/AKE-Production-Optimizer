<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources - AKE Production Optimizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>AKE Production Optimizer</h1>
    </div>
    <nav class="nav">
      <select id="region" class="region-select" aria-label="Region"></select>
      <a href="index.html">Calculator</a>
      <a href="recipes.html">Recipes</a>
      <a class="active" href="resources.html">Resources</a>
      <a href="facilities.html">Facilities</a>
    </nav>
  </header>

  <main class="full">
    <section class="panel">
      <h2>Resources</h2>
      <p class="muted" id="resource-count"></p>
      <div class="filters">
        <input id="search" type="search" placeholder="Filter resources by name..." />
        <select id="region-filter">
          <option value="0">All regions</option>
        </select>
        <select id="type">
          <option value="">All types</option>
          <option value="mine">Mine</option>
          <option value="pump">Pump</option>
          <option value="extract">Extract</option>
          <option value="collect">Collect</option>
        </select>
      </div>
      <div id="resource-list" class="stack"></div>
    </section>
  </main>

  <script type="module" src="resources.js"></script>
</body>
</html>
